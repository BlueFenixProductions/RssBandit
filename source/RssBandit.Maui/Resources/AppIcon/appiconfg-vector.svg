<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="300" height="300" viewBox="0 0 300 300" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ball" cx="0.42" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#FFFDE0"/>
      <stop offset="0.35" stop-color="#FFE97A"/>
      <stop offset="0.62" stop-color="#FFC000"/>
      <stop offset="0.85" stop-color="#FFA300"/>
      <stop offset="1" stop-color="#F57F00"/>
    </radialGradient>
    <linearGradient id="patch" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#3E3E3E"/>
      <stop offset="0.45" stop-color="#161616"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.35" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#4C477B"/>
      <stop offset="0.65" stop-color="#141033"/>
      <stop offset="1" stop-color="#020022"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ballClip">
      <circle cx="150" cy="150" r="96"/>
    </clipPath>
  </defs>

  <!-- head -->
  <circle cx="150" cy="150" r="96" fill="url(#ball)"/>

  <!-- forehead gloss, clipped to the head -->
  <g clip-path="url(#ballClip)">
    <ellipse cx="140" cy="88" rx="62" ry="32" fill="url(#gloss)" opacity="0.5"/>
  </g>

  <!-- smile: sly smirk, curling up on the right -->
  <path d="M 86 189 Q 150 222 207 176" stroke="#4F3600" stroke-width="8"
        fill="none" stroke-linecap="round"/>

  <!-- right eye (viewer right): half-lidded, looking left -->
  <ellipse cx="188" cy="134" rx="27" ry="19" fill="#D8D8E4"
           transform="rotate(-6 188 134)"/>
  <circle cx="182" cy="136" r="13.5" fill="url(#iris)"/>
  <circle cx="178" cy="131" r="3" fill="#FFFFFF" opacity="0.9"/>
  <!-- upper eyelid line -->
  <path d="M 164 126 Q 186 112 212 128" stroke="#8A6A1E" stroke-width="4.5"
        fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- strap: single band, 9 o'clock to 1 o'clock, clipped to the head -->
  <g clip-path="url(#ballClip)">
    <path d="M 50 150 L 204 52 L 214 67 L 60 165 Z" fill="#161616"/>
  </g>

  <!-- eye patch over viewer-left eye -->
  <g transform="rotate(-25 113 135)">
    <ellipse cx="113" cy="135" rx="33" ry="26" fill="url(#patch)"/>
    <path d="M 88 124 Q 110 108 138 122" stroke="#515151" stroke-width="5"
          fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
